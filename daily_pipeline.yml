name: .github/workflows/daily_pipeline.yml

on:
  schedule:
    # يشتغل يومياً الساعة 6:00 صباحاً بتوقيت الرياض (UTC+3) = 3:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # يسمح بتشغيل يدوي من تبويب Actions لأغراض الاختبار

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ODBC driver for SQL Server
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate daily sales orders
        run: python scripts/generate_daily_sales.py

      - name: Fetch exchange rates
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: python scripts/fetch_exchange_rates.py

      - name: Load data into SQL Server
        env:
          SQL_SERVER_HOST: ${{ secrets.SQL_SERVER_HOST }}
          SQL_DATABASE_NAME: ${{ secrets.SQL_DATABASE_NAME }}
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: python scripts/load_to_sql.py

      - name: Commit generated CSV files (audit trail)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incoming/*.csv
          git commit -m "chore: daily data batch $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
